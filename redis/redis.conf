# Redis 配置文件
# 用于阅影·log 项目的缓存优化

# ====================================
# 内存管理配置
# ====================================

# 最大内存限制
# 根据部署环境调整：
# - 开发环境: 256mb
# - 生产环境（小型）: 512mb
# - 生产环境（中型）: 1gb
# - 生产环境（大型）: 2gb+
# 注意：docker-compose.yml 中的 --maxmemory 参数会覆盖此设置
# 可通过环境变量 REDIS_MAX_MEMORY 调整
maxmemory 512mb

# 内存驱逐策略
# allkeys-lru: 对所有键使用 LRU 算法驱逐
# 这是最适合缓存场景的策略
maxmemory-policy allkeys-lru

# LRU 采样大小
# 值越大，LRU 算法越精确，但 CPU 开销越大
# 默认值为 5，推荐值为 10
# 范围: 1-10
maxmemory-samples 10

# ====================================
# 持久化配置
# ====================================

# AOF 持久化（追加文件）
# 对于缓存场景，可以禁用以提高性能
# 如果需要持久化，建议使用 RDB
appendonly yes
appendfilename "appendonly.aof"

# AOF 同步策略
# everysec: 每秒同步一次（推荐，平衡性能和安全性）
# always: 每次写入都同步（最安全，但性能最差）
# no: 由操作系统决定何时同步（性能最好，但可能丢失数据）
appendfsync everysec

# RDB 快照配置
# 格式: save <seconds> <changes>
# 在指定时间内有指定数量的键变化时保存快照
# 900秒（15分钟）内至少1个键变化
save 900 1
# 300秒（5分钟）内至少10个键变化
save 300 10
# 60秒（1分钟）内至少10000个键变化
save 60 10000

# RDB 文件名
dbfilename dump.rdb

# 数据目录
dir /data

# ====================================
# 网络配置
# ====================================

# 绑定地址
# 0.0.0.0 允许所有网络接口访问
bind 0.0.0.0

# 端口
port 6379

# TCP 连接队列长度
tcp-backlog 511

# 客户端超时时间（秒）
# 0 表示禁用超时
timeout 0

# TCP keepalive
# 如果非零，使用 SO_KEEPALIVE 发送 TCP ACKs 到客户端
tcp-keepalive 300

# ====================================
# 性能优化
# ====================================

# 数据库数量
databases 16

# 慢查询日志
# 执行时间超过此值（微秒）的命令会被记录
slowlog-log-slower-than 10000

# 慢查询日志最大长度
slowlog-max-len 128

# ====================================
# 安全配置
# ====================================

# 密码认证
# 通过环境变量 REDIS_PASSWORD 设置
# requirepass your_password_here

# 禁用危险命令
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ====================================
# 客户端配置
# ====================================

# 最大客户端连接数
# 0 表示无限制
maxclients 10000

# ====================================
# 日志配置
# ====================================

# 日志级别
# debug: 大量信息，用于开发/测试
# verbose: 包含很多不太有用的信息，但不像 debug 级别那么混乱
# notice: 适度冗长，适合生产环境
# warning: 仅记录非常重要/关键的消息
loglevel notice

# 日志文件
# 空字符串表示输出到标准输出
logfile ""

# ====================================
# 高级配置
# ====================================

# 哈希表优化
# 当哈希表中的条目数量超过此值时，使用更多内存但更快的哈希表
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# 列表优化
list-max-ziplist-size -2
list-compress-depth 0

# 集合优化
set-max-intset-entries 512

# 有序集合优化
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog 优化
hll-sparse-max-bytes 3000

# 流优化
stream-node-max-bytes 4096
stream-node-max-entries 100

# 活跃碎片整理
# 启用自动内存碎片整理
activedefrag yes

# 碎片整理的最小碎片百分比
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10

# 碎片整理的最大碎片百分比
active-defrag-threshold-upper 100

# 碎片整理的最小 CPU 百分比
active-defrag-cycle-min 1

# 碎片整理的最大 CPU 百分比
active-defrag-cycle-max 25

# ====================================
# 监控配置
# ====================================

# 启用 Redis 统计信息
# 可以通过 INFO 命令查看
# 无需额外配置，默认启用

# ====================================
# 注意事项
# ====================================
# 1. maxmemory 应根据实际部署环境调整
# 2. 对于纯缓存场景，可以禁用 AOF 以提高性能
# 3. maxmemory-samples 值越大越精确，但 CPU 开销越大
# 4. 生产环境建议设置 requirepass 密码
# 5. 定期监控 Redis 内存使用情况和命中率
